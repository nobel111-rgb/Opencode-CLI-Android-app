name: Build Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Environment, Google Services & Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PWD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASSWORD="${STORE_PWD_SECRET:-android}"
          KEY_PASSWORD="${KEY_PWD_SECRET:-android}"

          # 1. Ensure .env and .env.example exist for secrets gradle plugin
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi

          # 2. Create dummy google-services.json if not present
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789012",
    "project_id": "dummy-project",
    "storage_bucket": "dummy-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
        "android_client_info": {
          "package_name": "com.aistudio.opencode.cli"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "dummy_api_key"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          # 3. Setup Debug Keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Setup Release Keystore (my-upload-key.jks)
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks 2>/dev/null || echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks 2>/dev/null || true
          fi
          if [ ! -f "my-upload-key.jks" ] || [ ! -s "my-upload-key.jks" ]; then
            echo "Generating upload key for release build..."
            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Release Key,O=OpenCode,C=US"
          fi

      - name: Build Debug & Release APKs
        env:
          STORE_PWD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PWD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="${STORE_PWD_SECRET:-android}"
          export KEY_PASSWORD="${KEY_PWD_SECRET:-android}"
          export KEY_ALIAS="upload"
          export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
          gradle assembleDebug assembleRelease --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Create Repo Build Folder & Copy APKs
        run: |
          mkdir -p build

          # Copy generated APKs to ./build directory
          find app/build/outputs/apk/debug -name "*.apk" -exec cp -f {} build/OpenCode-CLI-debug.apk \; 2>/dev/null || true
          find app/build/outputs/apk/release -name "*.apk" -exec cp -f {} build/OpenCode-CLI-release.apk \; 2>/dev/null || true

          echo "Repository build folder contents:"
          ls -lh build/

      - name: Upload Build Folder APKs
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-apks
          path: build/*.apk
          retention-days: 14
          if-no-files-found: error
