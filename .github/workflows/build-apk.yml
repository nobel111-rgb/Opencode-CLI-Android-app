name: Build Android Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


permissions:
  contents: write   # ← critical for the push step


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Check if keystore secrets are provided
          if [ -n "$KEYSTORE_PATH" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease
          else
            echo "No keystore secrets found, building unsigned release APK..."
            ./gradlew assembleRelease
          fi

      - name: Create build folder in root
        run: mkdir -p build

      - name: Copy release APK to build folder
        run: |
          find app/build/outputs/apk/release -name "*.apk" -type f -exec cp {} build/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/*.apk
          retention-days: 30

      - name: Commit and push APK to main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add build/*.apk
          git commit -m "Add release APK [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
